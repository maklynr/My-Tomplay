<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Estúdio de Partituras</title>
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        
        /* Barra Superior */
        header { background: #1e293b; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
        .header-left { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
        .btn-upload { background: #3b82f6; color: white; padding: 6px 9px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; display: inline-block; }
        .btn-upload.pdf { background: #e11d48; }
        .btn-upload.audio { background: #8b5cf6; }
        input[type="file"] { display: none; }
        
        /* Zoom */
        .zoom-controls { display: flex; align-items: center; gap: 4px; }
        .btn-zoom { background: #334155; color: white; border: none; padding: 5px 9px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        #zoomLabel { font-size: 12px; color: #cbd5e1; min-width: 34px; text-align: center; }

        /* Área da Partitura / PDF */
        #sheet-wrapper { flex: 1; background: #ffffff; overflow-y: auto; overflow-x: hidden; padding: 4px 2px; position: relative; }
        #osmd-container { cursor: pointer; position: relative; }
        #note-names-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .note-label-html {
            position: absolute;
            transform: translateX(-50%);
            color: #b91c1c;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            text-shadow: 0 0 2px #ffffff, 0 0 2px #ffffff;
        }
        .lyric-cue-html {
            position: absolute;
            color: #b91c1c;
            font-weight: 400;
            font-style: italic;
            line-height: 1.1;
            white-space: nowrap;
            text-shadow: 0 0 2px #ffffff, 0 0 2px #ffffff;
        }
        #pdf-container { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 6px; }
        #pdf-container canvas { width: 100%; height: auto; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        #placeholder { color: #64748b; text-align: center; margin-top: 22vh; padding: 20px; }
        
        /* Rodapé */
        footer { background: #1e293b; padding: 8px 10px; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 7px; }
        .controls-row { display: flex; gap: 5px; align-items: center; justify-content: center; flex-wrap: wrap; }
        button.ctrl { background: #334155; color: white; border: none; padding: 7px 9px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        button.ctrl.play { background: #10b981; min-width: 80px; font-size: 13px; }
        button.ctrl.stop { background: #ef4444; }
        button.ctrl.toggle-on { background: #0284c7; }
        button.ctrl.toggle-off { background: #475569; color: #94a3b8; text-decoration: line-through; }
        button.ctrl.transpose { background: #d97706; }
        button.ctrl.names-on { background: #b91c1c; }
        button.ctrl:active { opacity: 0.8; }

        /* Seletor de Compasso + Letra */
        .measure-row { display: flex; gap: 5px; align-items: center; justify-content: center; font-size: 12px; color: #cbd5e1; flex-wrap: wrap; }
        .measure-input { width: 46px; padding: 5px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; text-align: center; font-size: 13px; font-weight: bold; }
        .btn-measure { background: #334155; color: white; border: none; padding: 5px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-measure.go { background: #2563eb; }
        .btn-measure.lyric { background: #9333ea; }
        .btn-measure.pdf-lyric { background: #0f766e; display: inline-block; }
        
        .sliders-row { display: flex; gap: 10px; justify-content: space-around; align-items: center; flex-wrap: wrap; font-size: 12px; color: #cbd5e1; }
        .slider-group { display: flex; align-items: center; gap: 5px; }
        input[type="range"] { width: 85px; accent-color: #10b981; }

        /* Modal de Importação de Letras do PDF */
        #lyricsModal {
            display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
            z-index: 100; align-items: center; justify-content: center; padding: 15px;
        }
        .modal-box {
            background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            width: 100%; max-width: 480px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header { padding: 12px 15px; border-bottom: 1px solid #334155; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 12px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .modal-row { display: flex; gap: 6px; align-items: center; }
        .modal-row input[type="number"] { width: 54px; padding: 6px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; text-align: center; font-weight: bold; }
        .modal-row input[type="text"] { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 13px; }
        .modal-row button.del { background: #ef4444; color: white; border: none; border-radius: 6px; padding: 6px 8px; cursor: pointer; font-weight: bold; }
        .modal-footer { padding: 10px 15px; border-top: 1px solid #334155; display: flex; justify-content: flex-end; gap: 8px; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <label class="btn-upload">
                📄 XML
                <input type="file" id="xmlInput" accept=".xml,.musicxml">
            </label>
            <label class="btn-upload pdf">
                📑 PDF
                <input type="file" id="pdfInput" accept="application/pdf,.pdf">
            </label>
            <label class="btn-upload audio">
                🎵 Áudio
                <input type="file" id="audioInput" accept="audio/*">
            </label>
        </div>
        <div class="zoom-controls">
            <span style="font-size:10px; color:#64748b; margin-right:2px;">v8</span>
            <button class="btn-zoom" id="btnZoomOut">−</button>
            <span id="zoomLabel">45%</span>
            <button class="btn-zoom" id="btnZoomIn">+</button>
        </div>
    </header>

    <div id="sheet-wrapper">
        <div id="placeholder">
            <h3>Nenhuma partitura carregada</h3>
            <p>Toque em <b>📄 XML</b> (com cursor e som de trompete) ou em <b>📑 PDF</b> (para abrir seu PDF pronto).</p>
        </div>
        <div id="osmd-container"></div>
        <div id="note-names-layer"></div>
        <div id="pdf-container"></div>
    </div>

    <footer>
        <div class="controls-row">
            <button class="ctrl stop" id="btnReset">⏮</button>
            <button class="ctrl play" id="btnPlay">▶ Tocar</button>
            <button class="ctrl" id="btnNext">Nota ⏭</button>
            <button class="ctrl names-on" id="btnToggleNames">A# Nomes</button>
            <button class="ctrl toggle-on" id="btnToggleNotes">🎺 Trompete</button>
            <button class="ctrl toggle-on" id="btnToggleAudio">🎵 MP3</button>
            <button class="ctrl transpose" id="btnTranspose">Tom: Dó</button>
        </div>

        <div class="measure-row" id="measureRow">
            <span>Comp.:</span>
            <button class="btn-measure" id="btnPrevMeasure">−</button>
            <input type="number" id="measureInput" class="measure-input" min="1" value="1">
            <button class="btn-measure" id="btnNextMeasure">+</button>
            <button class="btn-measure go" id="btnGoMeasure">Ir</button>
            <span id="totalMeasuresLabel" style="color: #94a3b8;">/ --</span>
            <button class="btn-measure lyric" id="btnAddLyric">💬 Letra</button>
            <label class="btn-measure pdf-lyric" id="pdfLyricsLabel">
                <span id="pdfLyricsText">📥 Letras PDF</span>
                <input type="file" id="pdfLyricsInput" accept="application/pdf,.pdf">
            </label>
        </div>

        <div class="sliders-row">
            <div class="slider-group">
                <span>Áudio: <b id="speedVal">100%</b></span>
                <input type="range" id="speedSlider" min="0.5" max="1.5" step="0.05" value="1">
            </div>
            <div class="slider-group">
                <span>BPM: <b id="bpmVal">80</b></span>
                <input type="range" id="bpmSlider" min="30" max="200" step="2" value="80">
            </div>
        </div>
        <audio id="audioPlayer" style="display:none;"></audio>
    </footer>

    <!-- Modal de confirmação das letras extraídas do PDF -->
    <div id="lyricsModal">
        <div class="modal-box">
            <div class="modal-header">
                <span>📥 Letras encontradas no PDF</span>
                <button class="btn-measure" id="btnCloseModal">✕</button>
            </div>
            <div style="padding: 8px 15px 0; font-size: 12px; color: #94a3b8;">
                Confira ou ajuste o número do compasso de cada frase e toque em <b>Aplicar</b>:
            </div>
            <div class="modal-body" id="modalLyricsList"></div>
            <div class="modal-footer">
                <button class="ctrl" id="btnCancelModal">Cancelar</button>
                <button class="ctrl play" id="btnApplyModal">✅ Aplicar</button>
            </div>
        </div>
    </div>

    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        let osmd = null;
        let currentMode = 'none';
        let currentXmlName = '';
        let savedLyrics = {};
        let isPlaying = false;
        let stepTimeout = null;
        let currentBpm = 80;
        let currentZoom = window.innerWidth < 600 ? 0.45 : 0.70;
        let playNotesSound = true;
        let playAudioTrack = true;
        let showNoteNames = true;
        let transposeSemitones = 0;
        let totalMeasures = 1;

        let audioCtx = null;
        let trumpetInstrument = null;
        let isLoadingTrumpet = false;

        function initAudioCtx() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!trumpetInstrument && !isLoadingTrumpet && typeof Soundfont !== 'undefined') {
                isLoadingTrumpet = true;
                btnToggleNotes.textContent = "⏳ Trompete...";
                Soundfont.instrument(audioCtx, 'trumpet').then((inst) => {
                    trumpetInstrument = inst;
                    isLoadingTrumpet = false;
                    btnToggleNotes.textContent = "🎺 Trompete";
                }).catch(() => {
                    isLoadingTrumpet = false;
                    btnToggleNotes.textContent = "🎺 Trompete";
                });
            }
        }

        function playTone(midiNote, durationSec) {
            if (!playNotesSound || !audioCtx) return;
            const adjustedMidi = midiNote + transposeSemitones;
            const playDur = Math.max(0.1, durationSec * 0.95);

            if (trumpetInstrument) {
                trumpetInstrument.play(adjustedMidi, audioCtx.currentTime, {
                    duration: playDur,
                    gain: 1.4
                });
            } else {
                const now = audioCtx.currentTime;
                const freq = 440 * Math.pow(2, (adjustedMidi - 69) / 12);
                const osc = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now);
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1800, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(0.22, now + 0.03);
                gain.gain.setValueAtTime(0.20, now + playDur - 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, now + playDur);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + playDur + 0.02);
            }
        }

        const sheetWrapper = document.getElementById('sheet-wrapper');
        const noteNamesLayer = document.getElementById('note-names-layer');
        const xmlInput = document.getElementById('xmlInput');
        const pdfInput = document.getElementById('pdfInput');
        const pdfLyricsInput = document.getElementById('pdfLyricsInput');
        const pdfLyricsText = document.getElementById('pdfLyricsText');
        const audioInput = document.getElementById('audioInput');
        const audioPlayer = document.getElementById('audioPlayer');
        const placeholder = document.getElementById('placeholder');
        const osmdContainer = document.getElementById('osmd-container');
        const pdfContainer = document.getElementById('pdf-container');
        const measureRow = document.getElementById('measureRow');

        const btnPlay = document.getElementById('btnPlay');
        const btnReset = document.getElementById('btnReset');
        const btnNext = document.getElementById('btnNext');
        const btnToggleNames = document.getElementById('btnToggleNames');
        const btnToggleNotes = document.getElementById('btnToggleNotes');
        const btnToggleAudio = document.getElementById('btnToggleAudio');
        const btnTranspose = document.getElementById('btnTranspose');
        const speedSlider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');
        const bpmSlider = document.getElementById('bpmSlider');
        const bpmVal = document.getElementById('bpmVal');
        const btnZoomIn = document.getElementById('btnZoomIn');
        const btnZoomOut = document.getElementById('btnZoomOut');
        const zoomLabel = document.getElementById('zoomLabel');

        const measureInput = document.getElementById('measureInput');
        const btnPrevMeasure = document.getElementById('btnPrevMeasure');
        const btnNextMeasure = document.getElementById('btnNextMeasure');
        const btnGoMeasure = document.getElementById('btnGoMeasure');
        const btnAddLyric = document.getElementById('btnAddLyric');
        const totalMeasuresLabel = document.getElementById('totalMeasuresLabel');

        const lyricsModal = document.getElementById('lyricsModal');
        const modalLyricsList = document.getElementById('modalLyricsList');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const btnCancelModal = document.getElementById('btnCancelModal');
        const btnApplyModal = document.getElementById('btnApplyModal');

        zoomLabel.textContent = Math.round(currentZoom * 100) + "%";

        function loadLyricsForScore(filename) {
            currentXmlName = filename;
            try {
                const raw = localStorage.getItem('tomplay_lyrics_' + filename);
                savedLyrics = raw ? JSON.parse(raw) : {};
            } catch (e) {
                savedLyrics = {};
            }
        }

        function saveLyricsForScore() {
            if (!currentXmlName) return;
            try {
                localStorage.setItem('tomplay_lyrics_' + currentXmlName, JSON.stringify(savedLyrics));
            } catch (e) {}
        }

        btnAddLyric.addEventListener('click', () => {
            if (currentMode !== 'xml' || !osmd) return;
            const mNum = parseInt(measureInput.value) || 1;
            const currentText = savedLyrics[mNum] || '';
            const input = prompt(
                `Digite a letra de entrada para o Compasso ${mNum}\n(Deixe vazio para apagar):`,
                currentText
            );
            if (input === null) return;
            if (input.trim() === '') {
                delete savedLyrics[mNum];
            } else {
                savedLyrics[mNum] = input.trim();
            }
            saveLyricsForScore();
            drawNoteNamesOverlay();
        });

        // Extrair letras do PDF (tenta texto direto; se for imagem, usa OCR automático)
        pdfLyricsInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            if (currentMode !== 'xml' || !osmd) {
                alert("Abra primeiro a partitura em formato XML.");
                return;
            }

            try {
                pdfLyricsText.textContent = "⏳ Lendo PDF...";
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const foundPhrases = [];

                // Tentativa 1: Texto selecionável direto do PDF
                for (let p = 1; p <= pdf.numPages; p++) {
                    const page = await pdf.getPage(p);
                    const textContent = await page.getTextContent();
                    const items = textContent.items.filter(it => it.str && it.str.trim() !== '');

                    const lines = [];
                    const numbersOnPage = [];

                    items.forEach(it => {
                        const x = it.transform[4];
                        const y = it.transform[5];
                        const str = it.str.trim();

                        if (/^\d{1,3}$/.test(str)) {
                            numbersOnPage.push({ num: parseInt(str), x, y });
                        }

                        let line = lines.find(l => Math.abs(l.y - y) < 5);
                        if (!line) {
                            line = { y, parts: [] };
                            lines.push(line);
                        }
                        line.parts.push({ x, str });
                    });

                    lines.sort((a, b) => b.y - a.y);

                    lines.forEach(line => {
                        line.parts.sort((a, b) => a.x - b.x);
                        const fullText = line.parts.map(pt => pt.str).join(' ').replace(/\s+/g, ' ').trim();
                        const firstX = line.parts[0].x;

                        const hasLowercase = /[a-záàâãéêíóôõúç]{2,}/.test(fullText);
                        const isInstrument = /trumpet|trompete|flute|sax|clarinet|piano|violin/i.test(fullText);

                        if (hasLowercase && !isInstrument && fullText.length >= 4) {
                            let bestNum = 1;
                            let bestScore = Infinity;
                            numbersOnPage.forEach(n => {
                                const dy = n.y - line.y;
                                if (dy > 5 && dy < 120) {
                                    const dist = Math.hypot(n.x - firstX, dy * 1.5);
                                    if (dist < bestScore) {
                                        bestScore = dist;
                                        bestNum = n.num;
                                    }
                                }
                            });
                            foundPhrases.push({
                                measure: Math.min(bestNum, totalMeasures),
                                text: fullText
                            });
                        }
                    });
                }

                // Tentativa 2: Se o PDF for imagem (sem texto selecionável), roda OCR automático
                if (foundPhrases.length === 0 && typeof Tesseract !== 'undefined') {
                    for (let p = 1; p <= pdf.numPages; p++) {
                        pdfLyricsText.textContent = `⏳ OCR pág. ${p}/${pdf.numPages}...`;
                        const page = await pdf.getPage(p);
                        const viewport = page.getViewport({ scale: 2.0 });
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                        const { data } = await Tesseract.recognize(canvas, 'por');
                        const ocrLines = data.text.split('\n');

                        ocrLines.forEach(rawLine => {
                            const txt = rawLine.replace(/\s+/g, ' ').trim();
                            // Pega linhas que tenham palavras reais em minúsculas (letras da música)
                            const hasWord = /[a-záàâãéêíóôõúç]{3,}/.test(txt);
                            const isInstrument = /trumpet|trompete|flute|sax|clarinet|piano|violin/i.test(txt);
                            if (hasWord && !isInstrument && txt.length >= 5) {
                                foundPhrases.push({
                                    measure: 1,
                                    text: txt
                                });
                            }
                        });
                    }
                }

                pdfLyricsText.textContent = "📥 Letras PDF";

                if (foundPhrases.length === 0) {
                    alert("Nenhuma frase de letra foi encontrada neste PDF.");
                    return;
                }

                // Monta a janela para conferir/ajustar o compasso de cada frase
                modalLyricsList.innerHTML = '';
                foundPhrases.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'modal-row';
                    row.innerHTML = `
                        <input type="number" min="1" max="${totalMeasures}" value="${item.measure}" title="Compasso">
                        <input type="text" value="${item.text.replace(/"/g, '&quot;')}">
                        <button class="del" title="Remover">✕</button>
                    `;
                    row.querySelector('.del').addEventListener('click', () => row.remove());
                    modalLyricsList.appendChild(row);
                });

                lyricsModal.style.display = 'flex';
            } catch (err) {
                pdfLyricsText.textContent = "📥 Letras PDF";
                alert("Erro ao ler o PDF.");
            }
        });

        function closeModal() {
            lyricsModal.style.display = 'none';
        }
        btnCloseModal.addEventListener('click', closeModal);
        btnCancelModal.addEventListener('click', closeModal);

        btnApplyModal.addEventListener('click', () => {
            const rows = modalLyricsList.querySelectorAll('.modal-row');
            rows.forEach(row => {
                const mNum = parseInt(row.querySelector('input[type="number"]').value);
                const txt = row.querySelector('input[type="text"]').value.trim();
                if (mNum >= 1 && mNum <= totalMeasures && txt !== '') {
                    savedLyrics[mNum] = txt;
                }
            });
            saveLyricsForScore();
            drawNoteNamesOverlay();
            closeModal();
        });

        function getNoteName(sourceNote) {
            if (!sourceNote || !sourceNote.Pitch) return '';
            const noteMap = { 0: 'C', 2: 'D', 4: 'E', 5: 'F', 7: 'G', 9: 'A', 11: 'B' };
            const pitch = sourceNote.Pitch;
            const letter = noteMap[pitch.FundamentalNote];
            if (!letter) return '';
            let acc = '';
            if (pitch.AccidentalHalfTones === 1) acc = '#';
            else if (pitch.AccidentalHalfTones === -1) acc = 'b';
            else if (pitch.AccidentalHalfTones === 2) acc = '##';
            else if (pitch.AccidentalHalfTones === -2) acc = 'bb';
            return letter + acc;
        }

        function getStaveLineScreenY(gm, refEl, lineIndex) {
            if (gm.stave && gm.stave.getYForLine && refEl && refEl.getScreenCTM) {
                const ctm = refEl.getScreenCTM();
                if (ctm) {
                    return ctm.d * gm.stave.getYForLine(lineIndex) + ctm.f;
                }
            }
            return null;
        }

        function drawNoteNamesOverlay() {
            noteNamesLayer.innerHTML = '';
            if (currentMode !== 'xml' || !osmd || !osmd.graphic || !osmd.graphic.MeasureList) return;

            const wrapperRect = sheetWrapper.getBoundingClientRect();
            const scrollTop = sheetWrapper.scrollTop;
            const scrollLeft = sheetWrapper.scrollLeft;
            const fontSize = Math.max(8, Math.round(16 * osmd.zoom));
            const lyricFontSize = Math.max(8, Math.round(14 * osmd.zoom));
            const frag = document.createDocumentFragment();

            for (let m = 0; m < osmd.graphic.MeasureList.length; m++) {
                const gm = osmd.graphic.MeasureList[m][0];
                if (!gm || !gm.staffEntries) continue;

                let firstRefEl = null;
                let measureFirstNoteX = null;

                for (let s = 0; s < gm.staffEntries.length; s++) {
                    const se = gm.staffEntries[s];
                    if (!se.graphicalVoiceEntries) continue;

                    for (let v = 0; v < se.graphicalVoiceEntries.length; v++) {
                        const gve = se.graphicalVoiceEntries[v];
                        if (!gve.notes) continue;

                        for (let n = 0; n < gve.notes.length; n++) {
                            const gn = gve.notes[n];
                            const sn = gn.sourceNote;
                            if (!sn) continue;

                            let noteEl = gn.getSVGGElement ? gn.getSVGGElement() : null;
                            if (!noteEl && gn.vfnote && gn.vfnote[0] && gn.vfnote[0].attrs) {
                                noteEl = gn.vfnote[0].attrs.el;
                            }
                            if (!noteEl) continue;
                            if (!firstRefEl) firstRefEl = noteEl;

                            if (sn.isRest()) continue;

                            const headEl = noteEl.querySelector('.vf-notehead') || noteEl;
                            const headRect = headEl.getBoundingClientRect();
                            const noteRect = noteEl.getBoundingClientRect();
                            if (headRect.width === 0 && headRect.height === 0) continue;

                            const x = (headRect.left - wrapperRect.left) + scrollLeft + (headRect.width / 2);
                            if (measureFirstNoteX === null) measureFirstNoteX = x;

                            if (!showNoteNames) continue;

                            const label = getNoteName(sn);
                            if (!label) continue;

                            const staveTopScreenY = getStaveLineScreenY(gm, noteEl, 0);
                            const refTopScreenY = (staveTopScreenY !== null)
                                ? Math.min(staveTopScreenY - 4, noteRect.top - 2)
                                : (noteRect.top - 2);

                            const y = (refTopScreenY - wrapperRect.top) + scrollTop - fontSize - 2;

                            const span = document.createElement('span');
                            span.className = 'note-label-html';
                            span.style.left = x + 'px';
                            span.style.top = y + 'px';
                            span.style.fontSize = fontSize + 'px';
                            span.textContent = label;
                            frag.appendChild(span);
                        }
                    }
                }

                const mNum = gm.measureNumber;
                if (savedLyrics[mNum] && firstRefEl) {
                    const staveBottomScreenY = getStaveLineScreenY(gm, firstRefEl, 4);
                    if (staveBottomScreenY !== null) {
                        const lyricY = (staveBottomScreenY - wrapperRect.top) + scrollTop + 6;
                        const lyricX = (measureFirstNoteX !== null)
                            ? Math.max(8, measureFirstNoteX - 10)
                            : ((firstRefEl.getBoundingClientRect().left - wrapperRect.left) + scrollLeft);

                        const lyricDiv = document.createElement('div');
                        lyricDiv.className = 'lyric-cue-html';
                        lyricDiv.style.left = lyricX + 'px';
                        lyricDiv.style.top = lyricY + 'px';
                        lyricDiv.style.fontSize = lyricFontSize + 'px';
                        lyricDiv.textContent = savedLyrics[mNum];
                        frag.appendChild(lyricDiv);
                    }
                }
            }
            noteNamesLayer.appendChild(frag);
        }

        function getIterator() {
            if (!osmd || !osmd.cursor) return null;
            return osmd.cursor.Iterator || osmd.cursor.iterator;
        }

        function updateMeasureDisplay() {
            const iter = getIterator();
            if (iter && iter.CurrentMeasure && document.activeElement !== measureInput) {
                measureInput.value = iter.CurrentMeasure.MeasureNumber;
            }
        }

        function jumpToMeasure(targetNum) {
            if (!osmd || currentMode !== 'xml') return;
            const num = Math.max(1, Math.min(totalMeasures, parseInt(targetNum) || 1));
            const wasPlaying = isPlaying;

            if (stepTimeout) clearTimeout(stepTimeout);
            stepTimeout = null;

            osmd.cursor.reset();
            const iter = getIterator();

            while (iter && !iter.EndReached) {
                if (iter.CurrentMeasure && iter.CurrentMeasure.MeasureNumber >= num) {
                    break;
                }
                osmd.cursor.next();
            }

            osmd.cursor.show();
            measureInput.value = (iter && iter.CurrentMeasure) ? iter.CurrentMeasure.MeasureNumber : num;

            if (audioPlayer.src && iter && iter.currentTimeStamp) {
                const secondsPerWholeNote = (60 / currentBpm) * 4;
                const targetSec = iter.currentTimeStamp.RealValue * secondsPerWholeNote;
                if (!isNaN(targetSec) && isFinite(targetSec)) {
                    audioPlayer.currentTime = Math.min(targetSec, audioPlayer.duration || targetSec);
                }
            }

            if (wasPlaying) {
                scheduleNextStep();
            }
        }

        osmdContainer.addEventListener('click', (e) => {
            if (currentMode !== 'xml' || !osmd || !osmd.graphic || !osmd.graphic.MeasureList) return;
            const svg = e.target.closest('svg') || osmdContainer.querySelector('svg');
            if (!svg) return;

            const rect = svg.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            const unit = 10 * osmd.zoom;

            let bestMeasure = null;
            let bestDist = Infinity;

            for (let i = 0; i < osmd.graphic.MeasureList.length; i++) {
                const gm = osmd.graphic.MeasureList[i][0];
                if (!gm || !gm.PositionAndShape) continue;

                const pos = gm.PositionAndShape.AbsolutePosition;
                const left = (pos.x + gm.PositionAndShape.BorderLeft) * unit;
                const right = (pos.x + gm.PositionAndShape.BorderRight) * unit;
                const top = (pos.y + gm.PositionAndShape.BorderTop) * unit - 18;
                const bottom = (pos.y + gm.PositionAndShape.BorderBottom) * unit + 18;

                if (clickX >= left && clickX <= right && clickY >= top && clickY <= bottom) {
                    bestMeasure = gm.measureNumber;
                    break;
                }

                const cx = (left + right) / 2;
                const cy = (top + bottom) / 2;
                const dist = Math.hypot(clickX - cx, clickY - cy);
                if (dist < bestDist) {
                    bestDist = dist;
                    bestMeasure = gm.measureNumber;
                }
            }

            if (bestMeasure !== null) {
                jumpToMeasure(bestMeasure);
            }
        });

        btnGoMeasure.addEventListener('click', () => {
            measureInput.blur();
            jumpToMeasure(measureInput.value);
        });

        measureInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                measureInput.blur();
                jumpToMeasure(measureInput.value);
            }
        });

        btnPrevMeasure.addEventListener('click', () => {
            jumpToMeasure((parseInt(measureInput.value) || 1) - 1);
        });

        btnNextMeasure.addEventListener('click', () => {
            jumpToMeasure((parseInt(measureInput.value) || 1) + 1);
        });

        function applyZoom() {
            zoomLabel.textContent = Math.round(currentZoom * 100) + "%";
            if (currentMode === 'xml' && osmd) {
                osmd.zoom = currentZoom;
                osmd.render();
                setTimeout(drawNoteNamesOverlay, 100);
            } else if (currentMode === 'pdf') {
                const canvases = pdfContainer.querySelectorAll('canvas');
                canvases.forEach(c => {
                    c.style.width = Math.round(currentZoom * 200) + "%";
                });
            }
        }

        window.addEventListener('resize', () => {
            if (currentMode === 'xml' && osmd) {
                setTimeout(drawNoteNamesOverlay, 300);
            }
        });

        btnZoomIn.addEventListener('click', () => {
            if (currentZoom < 1.5) {
                currentZoom = Math.round((currentZoom + 0.05) * 100) / 100;
                applyZoom();
            }
        });

        btnZoomOut.addEventListener('click', () => {
            if (currentZoom > 0.25) {
                currentZoom = Math.round((currentZoom - 0.05) * 100) / 100;
                applyZoom();
            }
        });

        btnToggleNames.addEventListener('click', () => {
            showNoteNames = !showNoteNames;
            btnToggleNames.className = showNoteNames ? 'ctrl names-on' : 'ctrl toggle-off';
            drawNoteNamesOverlay();
        });

        btnToggleNotes.addEventListener('click', () => {
            playNotesSound = !playNotesSound;
            btnToggleNotes.className = playNotesSound ? 'ctrl toggle-on' : 'ctrl toggle-off';
        });

        btnToggleAudio.addEventListener('click', () => {
            playAudioTrack = !playAudioTrack;
            btnToggleAudio.className = playAudioTrack ? 'ctrl toggle-on' : 'ctrl toggle-off';
            audioPlayer.muted = !playAudioTrack;
        });

        btnTranspose.addEventListener('click', () => {
            if (transposeSemitones === 0) {
                transposeSemitones = -2;
                btnTranspose.textContent = "Tom: Sib";
            } else {
                transposeSemitones = 0;
                btnTranspose.textContent = "Tom: Dó";
            }
        });

        xmlInput.addEventListener('change', (e) => {
            initAudioCtx();
            const file = e.target.files[0];
            if (!file) return;
            pauseAll();
            loadLyricsForScore(file.name);
            currentMode = 'xml';
            placeholder.style.display = 'none';
            pdfContainer.style.display = 'none';
            osmdContainer.style.display = 'block';
            noteNamesLayer.style.display = 'block';
            measureRow.style.display = 'flex';

            const reader = new FileReader();
            reader.onload = async (ev) => {
                if (!osmd) {
                    osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-container", {
                        autoResize: true,
                        backend: "svg",
                        drawTitle: true,
                        followCursor: true,
                        drawingParameters: "compacttight"
                    });
                }
                try {
                    await osmd.load(ev.target.result);
                    osmd.EngravingRules.PageLeftMargin = 1.5;
                    osmd.EngravingRules.PageRightMargin = 1.5;
                    osmd.EngravingRules.PageTopMargin = 2.0;
                    osmd.EngravingRules.MinimumDistanceBetweenSystems = 7.5;
                    osmd.zoom = currentZoom;
                    osmd.render();
                    setTimeout(drawNoteNamesOverlay, 120);
                    osmd.cursor.show();

                    if (osmd.sheet) {
                        if (osmd.sheet.SourceMeasures) {
                            totalMeasures = osmd.sheet.SourceMeasures.length;
                            measureInput.max = totalMeasures;
                            measureInput.value = 1;
                            totalMeasuresLabel.textContent = "/ " + totalMeasures;
                        }
                        if (osmd.sheet.DefaultStartTempoInBpm) {
                            currentBpm = Math.round(osmd.sheet.DefaultStartTempoInBpm);
                            bpmSlider.value = currentBpm;
                            bpmVal.textContent = currentBpm;
                        }
                    }
                } catch (err) {
                    alert("Não foi possível ler esta partitura. Use um arquivo .musicxml ou .xml não compactado.");
                }
            };
            reader.readAsText(file);
        });

        pdfInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            pauseAll();
            currentMode = 'pdf';
            placeholder.style.display = 'none';
            osmdContainer.style.display = 'none';
            noteNamesLayer.style.display = 'none';
            measureRow.style.display = 'none';
            pdfContainer.style.display = 'flex';
            pdfContainer.innerHTML = '<p style="color:#64748b;">Carregando PDF...</p>';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                pdfContainer.innerHTML = '';

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    pdfContainer.appendChild(canvas);
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                }
            } catch (err) {
                pdfContainer.innerHTML = '<p style="color:#ef4444;">Erro ao abrir o PDF.</p>';
            }
        });

        audioInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            audioPlayer.src = url;
            audioPlayer.playbackRate = parseFloat(speedSlider.value);
            audioPlayer.muted = !playAudioTrack;
        });

        speedSlider.addEventListener('input', () => {
            const rate = parseFloat(speedSlider.value);
            speedVal.textContent = Math.round(rate * 100) + "%";
            audioPlayer.playbackRate = rate;
        });

        bpmSlider.addEventListener('input', () => {
            currentBpm = parseInt(bpmSlider.value);
            bpmVal.textContent = currentBpm;
        });

        function playCurrentStepAndGetDelayMs() {
            const iter = getIterator();
            if (!osmd || !iter || iter.EndReached) return 0;

            updateMeasureDisplay();

            const notes = osmd.cursor.NotesUnderCursor();
            const secondsPerWholeNote = (60 / currentBpm) * 4;
            let minRealValue = 0.25;

            if (notes && notes.length > 0) {
                minRealValue = Infinity;
                notes.forEach(note => {
                    const durReal = note.Length ? note.Length.RealValue : 0.25;
                    if (durReal > 0 && durReal < minRealValue) {
                        minRealValue = durReal;
                    }
                    if (!note.isRest()) {
                        const isTieContinuation = note.NoteTie && note.NoteTie.StartNote !== note;
                        if (!isTieContinuation) {
                            const midi = note.halfTone + 12;
                            const noteDurationSec = durReal * secondsPerWholeNote;
                            playTone(midi, noteDurationSec);
                        }
                    }
                });
                if (minRealValue === Infinity) minRealValue = 0.25;
            }

            return minRealValue * secondsPerWholeNote * 1000;
        }

        function scheduleNextStep() {
            const iter = getIterator();
            if (!isPlaying || !osmd || !iter || currentMode !== 'xml') return;
            if (iter.EndReached) {
                pauseAll();
                return;
            }

            const delayMs = playCurrentStepAndGetDelayMs();

            stepTimeout = setTimeout(() => {
                if (!isPlaying) return;
                osmd.cursor.next();
                scheduleNextStep();
            }, delayMs);
        }

        function pauseAll() {
            isPlaying = false;
            btnPlay.textContent = "▶ Tocar";
            if (stepTimeout) clearTimeout(stepTimeout);
            stepTimeout = null;
            if (audioPlayer.src) audioPlayer.pause();
        }

        btnPlay.addEventListener('click', () => {
            initAudioCtx();
            if (isPlaying) {
                pauseAll();
            } else {
                isPlaying = true;
                btnPlay.textContent = "⏸ Pausar";
                if (currentMode === 'xml' && osmd) scheduleNextStep();
                if (audioPlayer.src) audioPlayer.play();
            }
        });

        btnReset.addEventListener('click', () => {
            pauseAll();
            if (currentMode === 'xml' && osmd) {
                osmd.cursor.reset();
                osmd.cursor.show();
                updateMeasureDisplay();
            }
            if (audioPlayer.src) audioPlayer.currentTime = 0;
        });

        btnNext.addEventListener('click', () => {
            initAudioCtx();
            const iter = getIterator();
            if (currentMode === 'xml' && osmd && iter && !iter.EndReached) {
                osmd.cursor.next();
                playCurrentStepAndGetDelayMs();
            }
        });
    </script>
</body>
</html>
